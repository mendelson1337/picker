<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picker - Game Cards</title>
  <style>
    body {
      margin: 0; padding: 0; background: transparent;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden; user-select: none;
    }
    #tinder-container {
      position: relative; width: 320px; height: 480px; perspective: 1000px;
    }
    .tinder-card {
      position: absolute; width: 100%; height: 100%; border-radius: 15px;
      overflow: hidden; background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      cursor: grab; transform-origin: 50% 100%; touch-action: none;
      transition: transform 0.2s ease-out, opacity 0.2s ease-out;
      display: flex; flex-direction: column;
    }
    .tinder-card:active { cursor: grabbing; }
    .tinder-card img {
      width: 100%; height: 65%; object-fit: cover; pointer-events: none;
    }
    .tinder-info {
      padding: 12px 15px; flex-grow: 1; display: flex; flex-direction: column;
      justify-content: flex-start; color: #333;
    }
    .tinder-info h3 {
      margin: 0 0 5px 0; font-size: 1.1rem; font-family: sans-serif;
    }
    .tinder-info p {
      margin: 0 0 8px 0; color: #555; font-size: 0.8rem; font-family: sans-serif;
      line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    }
    .game-meta {
      display: flex; justify-content: space-between; font-size: 0.75rem;
      font-family: sans-serif; color: #777; margin-top: auto; padding-top: 4px;
      border-top: 1px solid rgba(0,0,0,0.05);
    }
    #no-games {
      font-family: sans-serif; color: #888; text-align: center; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center; height: 100%;
    }
  </style>
</head>
<body>

<div id="tinder-container">
  <div id="no-games">Загрузка игр... 🎮</div>
</div>

<script>
const container = document.getElementById('tinder-container');

window.addEventListener('message', function(event) {
  if (event.data && event.data.type === 'LOAD_GAMES') {
    initCards(event.data.games);
  }
});

// КРИЧИМ WEWEB, ЧТО ФРЕЙМ ЗАГРУЗИЛСЯ И ГОТОВ ПРИНЯТЬ ИГРУ
window.parent.postMessage({ type: 'IFRAME_READY' }, '*');

function initCards(gamesArray) {
  if (!gamesArray || gamesArray.length === 0) {
    container.innerHTML = '<div id="no-games">Игры закончились! 🕹️</div>';
    return;
  }
  
  container.innerHTML = '';
  
  for (let i = gamesArray.length - 1; i >= 0; i--) {
    const game = gamesArray[i];
    const card = document.createElement('div');
    card.className = 'tinder-card';
    card.setAttribute('data-game-id', game.id);
    
    // Собираем градиент для нижней информационной части, если он задан в базе
    if (game.gradient_color_1 && game.gradient_color_2) {
      const angle = game.gradient_angle || 180;
      card.style.background = `linear-gradient(${angle}deg, ${game.gradient_color_1}, ${game.gradient_color_2})`;
    }
    
    const genresStr = game.genres ? game.genres.join(', ') : '';
    const rating = game.average_rating ? `⭐ ${Number(game.average_rating).toFixed(1)}` : '';
    
    card.innerHTML = `
      <img src="${game.image || 'https://placeholder.com'}">
      <div class="tinder-info">
        <h3>${game.title}</h3>
        <p>${game.description || ''}</p>
        <div class="game-meta">
          <span>${genresStr}</span>
          <span>${rating}</span>
        </div>
      </div>
    `;
    
    setupDrag(card);
    container.appendChild(card);
  }
}

function setupDrag(el) {
  let isDragging = false; let startX = 0; let startY = 0; let currentX = 0; let currentY = 0;

  function startDrag(e) {
    isDragging = true; el.style.transition = 'none';
    const pageX = e.pageX || (e.touches && e.touches.pageX);
    const pageY = e.pageY || (e.touches && e.touches.pageY);
    startX = pageX; startY = pageY;
  }

  function moveDrag(e) {
    if (!isDragging) return;
    const pageX = e.pageX || (e.touches && e.touches.pageX);
    const pageY = e.pageY || (e.touches && e.touches.pageY);
    if (!pageX || !pageY) return;
    currentX = pageX - startX; currentY = pageY - startY;
    const rotate = currentX * 0.05;
    el.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;
  }

  function endDrag() {
    if (!isDragging) return; isDragging = false;
    el.style.transition = 'transform 0.3s ease-out, opacity 0.3s ease-out';

    if (Math.abs(currentX) > 120) {
      const outX = currentX > 0 ? window.innerWidth : -window.innerWidth;
      const rotate = currentX * 0.05;
      el.style.transform = `translate(${outX}px, ${currentY}px) rotate(${rotate}deg)`;
      el.style.opacity = 0;

      const action = currentX > 0 ? 'like' : 'dislike';
      const gameId = el.getAttribute('data-game-id');

      window.parent.postMessage({
        type: 'TINDER_SWIPE',
        userId: gameId,
        action: action
      }, '*');

      setTimeout(() => {
        el.remove();
        if (container.querySelectorAll('.tinder-card').length === 0) {
          container.innerHTML = '<div id="no-games">Вы просмотрели все игры! 🕹️</div>';
        }
      }, 300);
    } else {
      el.style.transform = '';
    }
    currentX = 0; currentY = 0;
  }

  el.addEventListener('mousedown', startDrag);
  window.addEventListener('mousemove', moveDrag);
  window.addEventListener('mouseup', endDrag);
  el.addEventListener('touchstart', startDrag);
  window.addEventListener('touchmove', moveDrag);
  window.addEventListener('touchend', endDrag);
}
</script>

</body>
</html>
